name: Verify published ad images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-pages.yml'
      - 'ads/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify four direct URLs are actual PNGs (no redirects)
        run: |
          python3 - <<'PY'
          import struct
          import time
          import urllib.request

          base = "https://timingplanet.github.io/cp2-ads/ads/"
          images = {
              "courtyard-north.png": (1600, 900),
              "courtyard-south.png": (1600, 900),
              "queue-wide.png": (1600, 900),
              "queue-tall.png": (1080, 1440),
          }

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          opener = urllib.request.build_opener(NoRedirect)
          for filename, expected in images.items():
              url = base + filename
              for attempt in range(1, 7):
                  try:
                      with opener.open(urllib.request.Request(url, headers={"User-Agent": "cp2-ads-validation/1.0"}), timeout=20) as r:
                          status = r.status
                          content_type = r.headers.get("Content-Type", "").split(";")[0].strip().lower()
                          direct = r.geturl() == url
                          body = r.read()
                      assert status == 200, (filename, "HTTP", status)
                      assert direct, (filename, "redirect")
                      assert content_type == "image/png", (filename, "Content-Type", content_type)
                      assert body[:8] == b"\x89PNG\r\n\x1a\n", (filename, "invalid PNG signature")
                      dims = struct.unpack(">II", body[16:24])
                      assert dims == expected, (filename, "wrong dimensions", dims)
                      print(f"PASS {url}: HTTP {status}, {content_type}, {dims[0]}x{dims[1]}, {len(body)} bytes, no redirect")
                      break
                  except Exception as e:
                      if attempt == 6:
                          raise RuntimeError(f"FAILED {url}: {e}") from e
                      print(f"Retry {attempt}/6 for {url}: {e}", flush=True)
                      time.sleep(10)
          PY
