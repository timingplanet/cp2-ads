name: Build ad PNGs
on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - '.github/workflows/build-ads.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert original poster SVGs to PNG
        run: |
          python -m pip install "CairoSVG==2.8.2"
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          landscape = Path("source/landscape.svg").read_bytes()
          portrait = Path("source/portrait.svg").read_bytes()
          Path("ads").mkdir(exist_ok=True)
          for name in ("courtyard-north.png", "courtyard-south.png", "queue-wide.png"):
              cairosvg.svg2png(bytestring=landscape, write_to=f"ads/{name}")
          cairosvg.svg2png(bytestring=portrait, write_to="ads/queue-tall.png")
          from PIL import Image
          for name, expected in {
              "courtyard-north.png": (1600, 900),
              "courtyard-south.png": (1600, 900),
              "queue-wide.png": (1600, 900),
              "queue-tall.png": (1080, 1440),
          }.items():
              with Image.open(Path("ads") / name) as img:
                  assert img.size == expected, (name, img.size)
          PY
      - name: Commit ad images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ads
          if ! git diff --cached --quiet; then
            git commit -m "Build VRChat poster PNG assets"
            git push
          fi
